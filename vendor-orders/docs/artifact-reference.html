<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RID Vendor Order Consolidation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#2C327C; --cyan:#49C1C4; --steel:#3A7AA0;
  --bg:#F5F5F5; --surface:#FFFFFF; --surface-2:#FAFAFB;
  --text:#333333; --text-2:#555555; --muted:#777777; --border:#D8D8DC;
  --grad:linear-gradient(90deg,#2C327C,#3A7AA0,#49C1C4);
  --ok:#1f8a4c; --warn:#c47f00; --danger:#b23b3b; --pending:#8a5cc4;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d; --surface:#20232b; --surface-2:#262932;
    --text:#e9eaee; --text-2:#bcbfc7; --muted:#8b8f99; --border:#343843;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16181d; --surface:#20232b; --surface-2:#262932;
  --text:#e9eaee; --text-2:#bcbfc7; --muted:#8b8f99; --border:#343843;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Montserrat,Arial,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:600}
a{color:var(--cyan)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
.hdr-in{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#logo{height:46px;width:auto;flex:0 0 auto}
.hdr-title{flex:1 1 auto;min-width:180px}
.hdr-title .t1{font-weight:700;font-size:15px;letter-spacing:.2px}
.hdr-title .t2{color:var(--muted);font-size:11.5px;letter-spacing:.3px}
.cyan-rule{height:3px;background:var(--grad)}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-size:12px;color:var(--text-2);text-align:right}
.who b{color:var(--text)}
.badge-role{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px;background:var(--indigo);color:#fff}
.badge-role.purch{background:var(--cyan);color:#08343a}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 8px}
nav.tabs button{background:transparent;border:1px solid transparent;color:var(--text-2);font-family:inherit;font-weight:600;font-size:13px;padding:9px 15px;border-radius:8px;cursor:pointer}
nav.tabs button:hover{background:var(--surface-2)}
nav.tabs button.active{background:var(--surface);color:var(--indigo);border-color:var(--border);box-shadow:var(--shadow)}
:root[data-theme="dark"] nav.tabs button.active,
:root:not([data-theme="light"]) nav.tabs button.active{color:#9db4ff}
.btn{font-family:inherit;font-weight:600;font-size:13px;border-radius:8px;padding:9px 15px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.cyan{background:var(--cyan);color:#08343a;border-color:var(--cyan)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.section-title h2{font-size:16px;color:var(--indigo)}
:root[data-theme="dark"] .section-title h2,
:root:not([data-theme="light"]) .section-title h2{color:#9db4ff}
.section-title .rule{flex:1 1 auto;height:2px;background:var(--cyan);opacity:.5;border-radius:2px}
.pill{font-size:11px;color:var(--muted)}
.day-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:20px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--cyan)}
.day-head .dh-day{font-weight:700;font-size:15px;color:var(--indigo)}
:root[data-theme="dark"] .day-head .dh-day,
:root:not([data-theme="light"]) .day-head .dh-day{color:#9db4ff}
.day-head .dh-cut{font-size:12px;color:var(--text-2)}
.day-head .dh-count{font-size:12px;color:var(--muted);margin-left:auto}
.count-strong{color:var(--cyan);font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vcard{padding:14px;display:flex;flex-direction:column;gap:8px}
.vcard .vn{font-weight:700;font-size:14px}
.vcard .vc{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.vcard .vstat{display:flex;gap:14px;margin-top:2px}
.vstat .s{display:flex;flex-direction:column}
.vstat .s .num{font-size:20px;font-weight:700;line-height:1}
.vstat .s .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.vstat .ready .num{color:var(--cyan)}
.vstat .pend .num{color:var(--pending)}
.vsub{font-size:12px;color:var(--text-2)}
.vsub b{color:var(--text)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:760px}
th{background:var(--indigo);color:#fff;text-align:left;padding:9px 10px;font-weight:600;font-size:11.5px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:nth-child(even) td{background:var(--surface-2)}
td.num,th.num{text-align:right;white-space:nowrap}
td.po,th.po{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
tfoot td{font-weight:700;background:var(--surface)!important;border-top:2px solid var(--indigo)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.chip.pending{background:rgba(138,92,196,.15);color:var(--pending)}
.chip.ready{background:rgba(73,193,196,.18);color:#127f83}
.chip.ordered{background:rgba(44,50,124,.14);color:var(--indigo)}
.chip.received{background:rgba(31,138,76,.15);color:var(--ok)}
.chip.backordered{background:rgba(196,127,0,.16);color:var(--warn)}
:root[data-theme="dark"] .chip.ready,:root:not([data-theme="light"]) .chip.ready{color:#5fd6d9}
:root[data-theme="dark"] .chip.ordered,:root:not([data-theme="light"]) .chip.ordered{color:#9db4ff}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:600;color:var(--text-2)}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--cyan);outline-offset:-1px;border-color:var(--cyan)}
.fld.full{grid-column:1/-1}
.checkline{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--cyan);border-radius:10px;background:rgba(73,193,196,.07)}
.checkline input{margin-top:2px;width:18px;height:18px;accent-color:var(--cyan)}
.checkline .ct{font-size:12.5px;color:var(--text-2)}
.checkline .ct b{color:var(--text)}
.items-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.items-tbl{width:100%;border-collapse:collapse;min-width:860px;font-size:12.5px}
.items-tbl th{background:var(--surface-2);color:var(--text-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.items-tbl td{padding:5px 6px;border-bottom:1px solid var(--border);background:transparent!important}
.items-tbl input,.items-tbl select{width:100%;font-family:inherit;font-size:12.5px;padding:7px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.items-tbl input:focus,.items-tbl select:focus{outline:2px solid var(--cyan);outline-offset:-1px;border-color:var(--cyan)}
.items-tbl td.qtycol,.items-tbl td.costcol{width:88px}
.items-tbl td.coacol{min-width:150px}
.rm-row{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:15px;line-height:1;padding:4px 8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters .fld{min-width:150px}
.banner{padding:11px 14px;border-radius:10px;font-size:12.5px;margin:10px 0;border:1px solid}
.banner.warn{background:rgba(196,127,0,.1);border-color:var(--warn);color:var(--warn)}
.banner.info{background:rgba(73,193,196,.1);border-color:var(--cyan);color:#127f83}
:root[data-theme="dark"] .banner.info,:root:not([data-theme="light"]) .banner.info{color:#5fd6d9}
.banner.danger{background:rgba(178,59,59,.1);border-color:var(--danger);color:var(--danger)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{max-width:420px;width:100%;padding:22px;max-height:92vh;overflow:auto}
.modal h3{font-size:17px;color:var(--indigo);margin-bottom:4px}
:root[data-theme="dark"] .modal h3,:root:not([data-theme="light"]) .modal h3{color:#9db4ff}
.modal p{color:var(--text-2);font-size:12.5px;margin:0 0 14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--indigo);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:560px){#logo{height:38px}.hdr-title .t1{font-size:13px}}
</style>
</head>

/* ---- OPS-POL-001 PO logic ---- */
function pad2(s){s=String(s==null?'':s).replace(/\D/g,'');if(!s)return '';return s.length<2?s.padStart(2,'0'):s;}
function empName(code){return EMPLOYEES[code]||code||'';}
function projName(code){const p=PROJECTS.find(x=>x.code===code);return p?p.name:code;}
function coaName(code){const c=COST.codes[code];return c?c.name:'';}
function phaseName(code){const c=COST.codes[code];return c?(COST.phases[c.phase]||''):'';}
function suggestCoa(text){
  if(!text) return '';
  const t=(' '+text.toLowerCase()+' ');
  let best='',bestLen=0;
  for(const kw in COST.hints){ if(t.includes(kw) && kw.length>bestLen){best=COST.hints[kw];bestLen=kw.length;} }
  return best;
}
function assemblePO(emp,proj,coa,seq){ if(!emp||!proj||!coa||!seq) return ''; return emp+String(proj).toUpperCase()+'-'+coa+'-'+seq; }
function nextSeq(emp,proj,coa){
  let max=0;
  for(const o of ORDERS){
    if(o.poEmp===emp && o.poProject===proj && o.poCoa===coa){ const n=parseInt(o.poSeq,10); if(!isNaN(n)) max=Math.max(max,n); }
  }
  return pad2(max+1);
}
function nextCutoff(dayKey){
  const d=DAYS[dayKey]; if(!d) return null;
  const [h,m]=d.cutoff.split(':').map(Number);
  const now=new Date(); const t=new Date(now); t.setHours(h,m,0,0);
  let diff=(d.weekday-t.getDay()+7)%7;
  if(diff===0 && t<=now) diff=7;
  t.setDate(t.getDate()+diff);
  return t;
}
function fmtCountdown(ms){
  if(ms<=0) return null;
  const m=Math.floor(ms/60000);
  const days=Math.floor(m/1440), hrs=Math.floor((m%1440)/60), mins=m%60;
  if(days>0) return days+'d '+hrs+'h '+mins+'m';
  if(hrs>0) return hrs+'h '+mins+'m';
  return mins+'m';
}
function fmtDate(d){return d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});}
function defaultEmp(){
  if(identity && identity.name){ const f=identity.name.trim().toLowerCase().split(/\s+/)[0];
    for(const c in EMPLOYEES){ if(EMPLOYEES[c].toLowerCase()===f || EMPLOYEES[c].toLowerCase().startsWith(f)) return c; } }
  return '0';
}

/* ============================ CAPABILITIES ============================ */
async function initCaps(){
  if(!(window.claude && window.claude.use)){ dbState='nodb'; render(); return; }
  try{ db = await window.claude.use('db'); }catch(e){ db=null; }
  try{ downloads = await window.claude.use('downloads'); }catch(e){ downloads=null; }
  if(!db){ dbState='nodb'; render(); return; }
  db.doc('config/schedule').onSnapshot(snap=>{
    if(snap.exists){ const d=snap.data(); if(d && d.days){ for(const k in DAYS){ if(d.days[k] && d.days[k].cutoff) DAYS[k].cutoff=d.days[k].cutoff; } render(); } }
  }, ()=>{});
  db.collection('orders').onSnapshot(snap=>{
    ORDERS = snap.docs.map(doc=>({id:doc.id,...doc.data()}));
    dbState='ready'; render();
  }, err=>{ dbState='error'; dbErr=err.code; render(); });
}
async function addOrder(data){ if(!db){toast('Not connected');return false;} try{ await db.collection('orders').add(data); return true; }catch(e){ handleWriteErr(e); return false; } }
async function patchOrder(id,patch){ if(!db) return false; try{ await db.doc('orders/'+id).update(patch); return true; }catch(e){ handleWriteErr(e); return false; } }
async function deleteOrder(id){ if(!db) return; try{ await db.doc('orders/'+id).delete(); }catch(e){ handleWriteErr(e); } }
async function saveSchedule(){
  if(!db) return;
  const days={}; for(const k in DAYS) days[k]={cutoff:DAYS[k].cutoff};
  try{ await db.doc('config/schedule').set({days,updatedAt:new Date().toISOString(),updatedBy:identity?identity.name:''}); toast('Cutoffs saved'); }
  catch(e){ handleWriteErr(e); }
}
function handleWriteErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'){ readOnly=true; render(); toast('View-only access — changes not saved'); }
  else if(code==='quota_exceeded'){ toast('Storage full — remove old orders'); }
  else { toast('Save failed: '+(code||'error')); }
}

function vendorSubtotal(name,status){return vendorLines(name,status).reduce((s,o)=>s+lineTotal(o),0);}

function submitOrder(){
  const g=id=>document.getElementById(id);
  const vendor=g('f_vendor').value, po=g('f_po').value.trim();
  if(!po){ toast('PO # is required'); g('f_po').focus(); return; }
  const items=[];
  let missingCoa=false;
  document.querySelectorAll('.item-row').forEach(r=>{
    const name=r.querySelector('.i-name').value.trim();
    const qty=Number(r.querySelector('.i-qty').value);
    if(!name || !(qty>0)) return;
    const coa=r.querySelector('.i-coa').value;
    if(!coa){ missingCoa=true; }
    items.push({ productName:name, sku:r.querySelector('.i-sku').value.trim(), description:r.querySelector('.i-desc').value.trim(),
      poCoa:coa, qty, unit:r.querySelector('.i-unit').value, cost:Number(r.querySelector('.i-cost').value)||0 });
  });
  if(!items.length){ toast('Add at least one item with a product name and qty'); return; }
  if(missingCoa){ toast('Pick a cost code for every item — if unsure, check with Susan'); return; }
  const appr=g('f_appr').checked;
  const orderId=uid();
  const base={
    createdAt:new Date().toISOString(), createdBy:identity.name, orderId,
    vendor, orderDay:vendorObj(vendor).day, po,
    jobCode:g('f_job').value.trim(), client:g('f_client').value.trim(),
    neededBy:g('f_needed').value, notes:g('f_notes').value.trim(),
    approved:appr, status:appr?'ready':'pending'
  };
  (async()=>{
    let ok=0;
    for(const it of items){
      const done=await addOrder({...base,...it}); if(done) ok++;
    }
    if(ok){ toast(ok+' item'+(ok>1?'s':'')+(appr?' added to batch':' added — pending')); view='dashboard'; render(); }
  })();
}

      </tr>`;
    }
    h+=`</tbody><tfoot><tr><td colspan="9" class="num">Batch subtotal (ex. HST)</td><td class="num mono">${money(sub)}</td><td colspan="${isPurchaser()?3:2}"></td></tr></tfoot></table></div>`;
    h+=`<div class="row-actions" style="margin-top:14px">
      <button class="btn cyan" data-action="exportBatch" data-id="${esc(name)}">⭳ Export PO (CSV)</button>`;
    if(isPurchaser()) h+=`<button class="btn primary" data-action="markOrdered" data-id="${esc(name)}">Mark batch ordered</button>`;
    h+=`</div></div>`;
  }
  if(recent.length){
    h+=`<div class="section-title" style="margin-top:26px"><h2>Recent ${esc(name)} orders</h2><span class="rule"></span></div>
      <div class="card" style="padding:14px"><div class="tbl-wrap"><table><thead><tr>
      <th>Ordered</th><th>PO #</th><th>Product</th><th class="num">Qty</th><th>Status</th><th>Conf#</th><th>ETA</th>${isPurchaser()?'<th></th>':''}</tr></thead><tbody>`;
    for(const o of recent){
      h+=`<tr><td>${esc((o.orderedAt||'').slice(0,10))}</td><td class="po">${esc(o.po||'')}</td><td>${esc(o.productName||o.description)}</td>
        <td class="num mono">${esc(o.qty)}</td><td><span class="chip ${o.status}">${o.status}</span></td>
        <td>${esc(o.confirmation||'')}</td><td>${esc(o.eta||'')}</td>
        ${isPurchaser()?`<td class="row-actions">${o.status!=='received'?`<button class="btn sm" data-action="receive" data-id="${o.id}">Received</button>`:''}${o.status==='ordered'?`<button class="btn sm ghost" data-action="backorder" data-id="${o.id}">Backorder</button>`:''}</td>`:''}
      </tr>`;
    }
    h+=`</tbody></table></div></div>`;
  }
  renderApp(h); tickCountdowns();
}

/* ---------- TRACK ---------- */
function renderTrack(){
  const vOpts=['<option value="">All vendors</option>'].concat(VENDORS.map(v=>`<option ${filters.vendor===v.name?'selected':''}>${esc(v.name)}</option>`)).join('');
  const sOpts=['','pending','ready','ordered','received','backordered'].map(s=>`<option value="${s}" ${filters.status===s?'selected':''}>${s?s[0].toUpperCase()+s.slice(1):'All statuses'}</option>`).join('');
  let rows=ORDERS.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  if(filters.vendor) rows=rows.filter(o=>o.vendor===filters.vendor);
  if(filters.status) rows=rows.filter(o=>o.status===filters.status);
  if(filters.q){const q=filters.q.toLowerCase();rows=rows.filter(o=>[o.po,o.jobCode,o.client,o.productName,o.description,o.sku,o.createdBy,o.poCoa].some(x=>String(x||'').toLowerCase().includes(q)));}
  let h=`<div class="section-title"><h2>Track orders</h2><span class="rule"></span><span class="pill">${rows.length} line${rows.length===1?'':'s'}</span></div>
   <div class="filters">
     <div class="fld"><label>Vendor</label><select data-filter="vendor">${vOpts}</select></div>
     <div class="fld"><label>Status</label><select data-filter="status">${sOpts}</select></div>
     <div class="fld" style="flex:1 1 200px"><label>Search PO / job / product / client</label><input data-filter="q" value="${esc(filters.q)}" placeholder="type to filter"></div>
   </div>`;
  if(!rows.length){ h+=`<div class="card"><div class="empty">No lines match.</div></div>`; renderApp(h); return; }
  h+=`<div class="card" style="padding:12px"><div class="tbl-wrap"><table><thead><tr>
    <th>Added</th><th>Vendor</th><th>PO #</th><th>COA</th><th>Product</th><th>Description</th><th class="num">Qty</th><th>Need by</th><th>Rep</th><th>Status</th><th></th></tr></thead><tbody>`;
  for(const o of rows){
    let acts=`<button class="btn sm ghost" data-action="edit" data-id="${o.id}">Edit</button>`;
    if(o.status==='pending') acts+=`<button class="btn sm cyan" data-action="approve" data-id="${o.id}">Approve</button>`;
    if(o.status==='ordered'||o.status==='backordered') acts+=`<button class="btn sm" data-action="receive" data-id="${o.id}">Received</button>`;
    if(o.status==='ordered') acts+=`<button class="btn sm ghost" data-action="backorder" data-id="${o.id}">Backorder</button>`;
    acts+=`<button class="btn sm ghost" data-action="del" data-id="${o.id}">✕</button>`;
    h+=`<tr>
      <td class="small">${esc((o.createdAt||'').slice(0,10))}</td><td>${esc(o.vendor)}</td><td class="po">${esc(o.po||'')}</td><td>${esc(o.poCoa||'')}</td>
      <td>${esc(o.productName||'')}</td><td>${esc(o.description)}</td>
      <td class="num mono">${esc(o.qty)} ${esc(o.unit||'')}</td><td class="small">${esc(o.neededBy||'')}</td><td class="small">${esc(o.createdBy)}</td>
      <td><span class="chip ${o.status}">${o.status}</span></td>
      <td class="row-actions">${acts}</td></tr>`;
  }
  h+=`</tbody></table></div></div>`;
  renderApp(h);
}

/* ---------- SETTINGS ---------- */
function renderSettings(){
  let h=`<div class="section-title"><h2>Weekly cutoff settings</h2><span class="rule"></span></div>
   <div class="card" style="padding:20px"><p class="muted small" style="margin-top:0">Set the deadline for each order day. Lines added after the cutoff still queue — they simply ride the next week's shipment. Saved for the whole team.</p>
   <div class="form-grid">`;
  for(const k of Object.keys(DAYS)){
    h+=`<div class="fld"><label>${esc(DAYS[k].label)} cutoff time</label><input type="time" data-cuttime="${k}" value="${esc(DAYS[k].cutoff)}"></div>`;
  }
  h+=`</div><div style="margin-top:18px"><button class="btn primary" data-action="saveSchedule">Save cutoffs</button></div>
    <div class="banner info" style="margin-top:18px">Vendor roster, and the OPS-POL-001 employee / project / cost-code tables, are set in the app build. To add or change any of them, ask Mike to update the build.</div></div>`;
  renderApp(h);
}

/* ============================ ORDER ACTIONS ============================ */
function approve(id){patchOrder(id,{approved:true,status:'ready'}).then(ok=>ok&&toast('Approved — in this week\'s batch'));}
function receive(id){patchOrder(id,{status:'received',receivedAt:new Date().toISOString()}).then(ok=>ok&&toast('Marked received'));}
function backorder(id){patchOrder(id,{status:'backordered'}).then(ok=>ok&&toast('Marked backordered'));}
function del(id){openConfirm('Delete this line?','This removes it from the shared queue for everyone.',()=>{deleteOrder(id).then(()=>toast('Deleted'));});}
function deleteOrderGroup(orderId){
  const lines=ORDERS.filter(o=>o.orderId===orderId);
  if(!lines.length) return;
  openConfirm('Delete entire order?',`This removes all ${lines.length} item${lines.length>1?'s':''} on this order (PO ${esc(lines[0].po||'')}) for everyone.`,async()=>{
    for(const o of lines){ await deleteOrder(o.id); }
    toast('Order deleted'); closeModal();
  });
}
async function markOrdered(name){
  const lines=batchLines(name);
  if(!lines.length) return;
  openOrderModal(name,lines.length, async (conf,eta)=>{
    const orderedAt=new Date().toISOString();
    for(const o of lines){ await patchOrder(o.id,{status:'ordered',orderedAt,orderedBy:identity.name,confirmation:conf,eta}); }
    toast(lines.length+' line'+(lines.length>1?'s':'')+' marked ordered');
  });
}
function buildCSV(name,lines){
  const q=s=>{s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const head=[`# Purchase Order — ${name}`,`# Robins Interiors & Design (J.M Robins Construction Ltd.)`,`# Order day: ${DAYS[vendorObj(name).day].label}`,`# Generated: ${new Date().toLocaleString('en-CA')} by ${identity.name}`,`# PO coding per OPS-POL-001`,''];
  const cols=['PO #','Cost Code','Cost Code Name','Phase','Job','Product','SKU','Description','Qty','Unit','Needed By','Unit Cost','Line Total','Notes'];
  const body=lines.map(o=>[o.po,o.poCoa,coaName(o.poCoa),phaseName(o.poCoa),o.jobCode,o.productName,o.sku,o.description,o.qty,o.unit,o.neededBy,Number(o.cost||0).toFixed(2),lineTotal(o).toFixed(2),o.notes].map(q).join(','));
  const sub=lines.reduce((s,o)=>s+lineTotal(o),0);
  const subRow=Array(cols.length).fill(''); subRow[11]='SUBTOTAL (ex. HST)'; subRow[12]=sub.toFixed(2);
  return head.join('\n')+'\n'+cols.map(q).join(',')+'\n'+body.join('\n')+'\n'+subRow.map(q).join(',')+'\n';
}
async function exportBatch(name){
  const lines=batchLines(name); if(!lines.length){toast('No ready lines');return;}
  const csv=buildCSV(name,lines);
  const fname='PO_'+name.replace(/[^A-Za-z0-9]+/g,'_')+'_'+todayStr()+'.csv';
  if(downloads){
    try{ const r=await downloads.save({filename:fname,data:csv}); if(r.status==='saved') toast('PO exported'); }
    catch(e){ if(e.code==='declined') return; copyText(csv); }
  } else { copyText(csv); }
}
function copyText(t){ if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('PO copied to clipboard'),()=>toast('Copy failed'));} else toast('Export unavailable in preview'); }

/* ============================ MODALS ============================ */
function openIdentityModal(first){
  const cur=identity||{name:'',role:'Sales rep'};
  document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="card modal">
    <h3>${first?'Welcome':'Your details'}</h3>
    <p>${first?'Tell us who you are. This tags every order you add and is remembered on this device.':'Update your name or role.'}</p>
    <div class="fld" style="margin-bottom:12px"><label>Your name</label><input id="id_name" value="${esc(cur.name)}" placeholder="First Last"></div>
    <div class="fld" style="margin-bottom:16px"><label>Role</label><select id="id_role">
      <option ${cur.role==='Sales rep'?'selected':''}>Sales rep</option>
      <option ${cur.role==='Purchaser'?'selected':''}>Purchaser</option></select>
      <span class="muted small">Purchasers can place batch orders and set cutoffs.</span></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn primary" data-action="saveId">Save</button></div>
  </div></div>`;
}
function saveId(){
  const n=document.getElementById('id_name').value.trim(); const r=document.getElementById('id_role').value;
  if(!n){toast('Enter your name');return;}
  saveIdentity({name:n,role:r}); document.getElementById('modalRoot').innerHTML=''; render();
}
function openOrderModal(name,count,cb){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="card modal">
    <h3>Mark ${esc(name)} batch ordered</h3>
    <p>${count} line${count>1?'s':''} will move to <b>Ordered</b>. Record the confirmation from the vendor (optional).</p>
    <div class="fld" style="margin-bottom:12px"><label>Order confirmation #</label><input id="om_conf" placeholder="optional"></div>
    <div class="fld" style="margin-bottom:16px"><label>ETA / expected ship</label><input id="om_eta" type="date"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" data-action="closeModal">Cancel</button><button class="btn primary" id="om_go">Confirm ordered</button></div>
  </div></div>`;
  document.getElementById('om_go').onclick=()=>{const c=document.getElementById('om_conf').value.trim();const e=document.getElementById('om_eta').value;document.getElementById('modalRoot').innerHTML='';cb(c,e);};
}
function openConfirm(title,msg,cb){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="card modal">
    <h3>${esc(title)}</h3><p>${msg}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" data-action="closeModal">Cancel</button><button class="btn primary" id="cf_go">Delete</button></div>
  </div></div>`;
  document.getElementById('cf_go').onclick=()=>{document.getElementById('modalRoot').innerHTML='';cb();};
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function edit(id){ const o=ORDERS.find(x=>x.id===id); if(o) openEditModal(o); }
function openEditModal(o){
  const vOpts=VENDORS.map(v=>`<option ${v.name===o.vendor?'selected':''}>${esc(v.name)}</option>`).join('');
  const uOpts=UNITS.map(u=>`<option ${u===o.unit?'selected':''}>${u}</option>`).join('');
  const sOpts=['pending','ready','ordered','received','backordered'].map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('');
  const groupCount=ORDERS.filter(x=>x.orderId&&x.orderId===o.orderId).length;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="card modal" style="max-width:640px">
    <h3>Edit line</h3>
    <p>Changes save to the shared queue for everyone.</p>
    <div class="form-grid">
      <div class="fld"><label>Vendor</label><select id="e_vendor">${vOpts}</select></div>
      <div class="fld"><label>PO # <span class="req">*</span></label><input id="e_po" value="${esc(o.po||'')}"></div>
      <div class="fld"><label>Cost code (COA)</label><select id="e_coa">${coaOptionsHTML(o.poCoa||'')}</select></div>
      <div class="fld"><label>Status</label><select id="e_status">${sOpts}</select></div>
      <div class="fld"><label>Job code</label><input id="e_job" value="${esc(o.jobCode)}"></div>
      <div class="fld"><label>Client / address</label><input id="e_client" value="${esc(o.client)}"></div>
      <div class="fld"><label>Needed by</label><input id="e_needed" type="date" value="${esc(o.neededBy||'')}"></div>
      <div class="fld full"><label>Product name <span class="req">*</span></label><input id="e_name" value="${esc(o.productName)}"></div>
      <div class="fld"><label>SKU</label><input id="e_sku" value="${esc(o.sku)}"></div>
      <div class="fld full"><label>Description</label><input id="e_desc" value="${esc(o.description)}"></div>
      <div class="fld"><label>Qty <span class="req">*</span></label><input id="e_qty" type="number" min="0" step="any" value="${esc(o.qty)}"></div>
      <div class="fld"><label>Unit</label><select id="e_unit">${uOpts}</select></div>
      <div class="fld"><label>Cost/unit</label><input id="e_cost" type="number" min="0" step="any" value="${esc(o.cost)}"></div>
      <div class="fld full"><label>Notes</label><input id="e_notes" value="${esc(o.notes||'')}"></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
      <div class="row-actions">
        <button class="btn ghost" style="color:var(--danger);border-color:var(--danger)" id="e_del">Delete line</button>
        ${o.orderId?`<button class="btn ghost" style="color:var(--danger);border-color:var(--danger)" id="e_delorder">Delete entire order (${groupCount})</button>`:''}
      </div>
      <div style="display:flex;gap:10px"><button class="btn ghost" data-action="closeModal">Cancel</button><button class="btn primary" id="e_save">Save changes</button></div>
    </div>
  </div></div>`;
  document.getElementById('e_save').onclick=()=>{
    const g=id=>document.getElementById(id);
    const po=g('e_po').value.trim();
    const name=g('e_name').value.trim(), qty=Number(g('e_qty').value);
    if(!po){ toast('PO # is required'); return; }
    if(!name || !(qty>0)){ toast('Product name and qty required'); return; }
    const status=g('e_status').value;
    const patch={ vendor:g('e_vendor').value, orderDay:vendorObj(g('e_vendor').value).day,
      po, poCoa:g('e_coa').value,
      jobCode:g('e_job').value.trim(), client:g('e_client').value.trim(), neededBy:g('e_needed').value,
      productName:name, sku:g('e_sku').value.trim(), description:g('e_desc').value.trim(),
      qty, unit:g('e_unit').value, cost:Number(g('e_cost').value)||0, notes:g('e_notes').value.trim(),
      status, approved: status!=='pending' };
    closeModal();
    patchOrder(o.id,patch).then(ok=>ok&&toast('Line updated'));
  };
  document.getElementById('e_del').onclick=()=>{ closeModal(); del(o.id); };
  const dgo=document.getElementById('e_delorder'); if(dgo) dgo.onclick=()=>{ deleteOrderGroup(o.orderId); };
}

/* ============================ COUNTDOWN TICK ============================ */
function tickCountdowns(){
  document.querySelectorAll('[data-cutoff]').forEach(el=>{
    const iso=el.getAttribute('data-cutoff'); if(!iso){el.textContent='—';return;}
    const ms=new Date(iso)-new Date(); const cd=fmtCountdown(ms);
    if(cd===null){ el.textContent='in progress'; el.style.color='var(--warn)'; }
    else { const d=new Date(iso); el.textContent=fmtDate(d)+' · '+cd+' left'; el.style.color=ms<12*3600*1000?'var(--warn)':''; }
  });
}
setInterval(tickCountdowns,1000);

/* ============================ EVENTS ============================ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-vendor],[data-action]'); if(!t) return;
  if(t.dataset.tab){ view=t.dataset.tab; selectedVendor=null; render(); return; }
  if(t.dataset.vendor && !t.dataset.action){ selectedVendor=t.dataset.vendor; view='batch'; render(); return; }
  const a=t.dataset.action, id=t.dataset.id;
  if(a==='addItemRow'){ document.getElementById('itemRows').insertAdjacentHTML('beforeend', itemRowHTML()); return; }
  if(a==='removeItemRow'){ const row=t.closest('.item-row'); const body=document.getElementById('itemRows'); if(row && body.querySelectorAll('.item-row').length>1) row.remove(); return; }
  ({
    submitOrder, saveId, closeModal, saveSchedule,
    clearForm:()=>renderAddForm(),
    editIdentity:()=>openIdentityModal(false),
    edit:()=>edit(id),
    approve:()=>approve(id), receive:()=>receive(id), backorder:()=>backorder(id), del:()=>del(id),
    markOrdered:()=>markOrdered(id), exportBatch:()=>exportBatch(id)
  }[a]||(()=>{}))();
});
document.addEventListener('input',e=>{
  const f=e.target.closest('[data-filter]'); if(f){ filters[f.dataset.filter]=f.value; if(f.dataset.filter==='q'){renderTrackKeepFocus();} else render(); return; }
  const c=e.target.closest('[data-cuttime]'); if(c){ DAYS[c.dataset.cuttime].cutoff=c.value; }
});
document.addEventListener('change',e=>{
  const nm=e.target.closest('.i-name');
  if(nm){ const row=nm.closest('.item-row'); const coa=row&&row.querySelector('.i-coa'); if(coa && !coa.value){ const s=suggestCoa(nm.value); if(s) coa.value=s; } }
});
function renderTrackKeepFocus(){
  const active=document.activeElement, val=active&&active.value, pos=active&&active.selectionStart;
  renderTrack();
  const box=document.querySelector('[data-filter="q"]'); if(box){box.focus();box.value=val;try{box.setSelectionRange(pos,pos);}catch(e){}}
}
document.getElementById('themeBtn').onclick=()=>{const n=currentTheme()==='dark'?'light':'dark';try{localStorage.setItem('rid_theme',n);}catch(e){}render();};

/* ============================ BOOT ============================ */
render();
initCaps();
</script>
