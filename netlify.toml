# Netlify configuration for JMRC apps
# - App-launcher landing page (static) lives at the site root
# - Cabinet Designer (Vite + React) builds into /cabinet-designer/
# - Aline Cabinet Designer builds into /aline-designer/
# - Vendor Orders builds into /vendor-orders/; its API is a Netlify Function
#   (netlify/functions/vendor-orders-api) served at /api/vendor-orders/*

[build]
  publish = "_site"
  command = "bash ./scripts/netlify-build.sh"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Vendor Orders API → Netlify Function (must come before the SPA fallbacks)
[[redirects]]
  from = "/api/vendor-orders/*"
  to = "/.netlify/functions/vendor-orders-api/:splat"
  status = 200
  force = true

# Cabinet Designer (OPPEIN) SPA fallback
[[redirects]]
  from = "/cabinet-designer/*"
  to = "/cabinet-designer/index.html"
  status = 200

# Aline Cabinet Designer SPA fallback
[[redirects]]
  from = "/aline-designer/*"
  to = "/aline-designer/index.html"
  status = 200

# Vendor Orders SPA fallback
[[redirects]]
  from = "/vendor-orders/*"
  to = "/vendor-orders/index.html"
  status = 200

# Production context
[context.production]
  command = "bash ./scripts/netlify-build.sh"

# Deploy Preview context
[context.deploy-preview]
  command = "bash ./scripts/netlify-build.sh"

# Branch deploy context
[context.branch-deploy]
  command = "bash ./scripts/netlify-build.sh"
