# Netlify configuration for JMRC apps
# - App-launcher landing page (static) lives at the site root
# - Cabinet Designer (Vite + React) builds into /cabinet-designer/
# - Aline Cabinet Designer builds into /aline-designer/
# - Finish Selections builds into /selections/
# - Vendor Orders builds into /vendor-orders/; its API is a Netlify Function
#   (netlify/functions/vendor-orders-api) served at /api/vendor-orders/*

[build]
  publish = "_site"
  command = "bash ./scripts/netlify-build.sh"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# All redirects live here, in order: the first matching rule wins. Don't add a
# _redirects file: Netlify evaluates it BEFORE these rules, so a catch-all
# there would shadow the API route and the SPA fallbacks.

# Vendor Orders API → Netlify Function
[[redirects]]
  from = "/api/vendor-orders/*"
  to = "/.netlify/functions/vendor-orders-api/:splat"
  status = 200
  force = true

# Cabinet Designer (OPPEIN) SPA fallback
[[redirects]]
  from = "/cabinet-designer/*"
  to = "/cabinet-designer/index.html"
  status = 200

# Aline Cabinet Designer SPA fallback
[[redirects]]
  from = "/aline-designer/*"
  to = "/aline-designer/index.html"
  status = 200

# Finish Selections SPA fallback
[[redirects]]
  from = "/selections/*"
  to = "/selections/index.html"
  status = 200

# Vendor Orders SPA fallback
[[redirects]]
  from = "/vendor-orders/*"
  to = "/vendor-orders/index.html"
  status = 200

# Friendly fallback: unknown top-level paths land on the launcher. Keep last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production context
[context.production]
  command = "bash ./scripts/netlify-build.sh"

# Deploy Preview context
[context.deploy-preview]
  command = "bash ./scripts/netlify-build.sh"

# Branch deploy context
[context.branch-deploy]
  command = "bash ./scripts/netlify-build.sh"
