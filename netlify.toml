# Netlify configuration for JMRC apps
# - Time Track CRM (static single-HTML) lives at the site root
# - Cabinet Designer (Vite + React) builds into /cabinet-designer/

[build]
  publish = "_site"
  command = "bash ./scripts/netlify-build.sh"

[build.environment]
  NODE_VERSION = "20"

# Cabinet Designer SPA fallback — all sub-paths serve its index
[[redirects]]
  from = "/cabinet-designer/*"
  to = "/cabinet-designer/index.html"
  status = 200

# Legacy Time Track aliases
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/track"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/crm"
  to = "/index.html"
  status = 301

# Production context
[context.production]
  command = "bash ./scripts/netlify-build.sh"

# Deploy Preview context
[context.deploy-preview]
  command = "bash ./scripts/netlify-build.sh"

# Branch deploy context
[context.branch-deploy]
  command = "bash ./scripts/netlify-build.sh"
