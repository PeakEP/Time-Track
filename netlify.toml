# Netlify configuration for JMRC apps
# - App-launcher landing page (static) lives at the site root
# - Cabinet Designer (Vite + React) builds into /cabinet-designer/
# - Aline Cabinet Designer builds into /aline-designer/

[build]
  publish = "_site"
  command = "bash ./scripts/netlify-build.sh"

[build.environment]
  NODE_VERSION = "20"

# Cabinet Designer (OPPEIN) SPA fallback
[[redirects]]
  from = "/cabinet-designer/*"
  to = "/cabinet-designer/index.html"
  status = 200

# Aline Cabinet Designer SPA fallback
[[redirects]]
  from = "/aline-designer/*"
  to = "/aline-designer/index.html"
  status = 200

# Production context
[context.production]
  command = "bash ./scripts/netlify-build.sh"

# Deploy Preview context
[context.deploy-preview]
  command = "bash ./scripts/netlify-build.sh"

# Branch deploy context
[context.branch-deploy]
  command = "bash ./scripts/netlify-build.sh"
